name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on PRs, but never on main: a fresh push must not
# cancel a deploy that is mid-flight (migrations applied, worker half-rolled).
# Main pushes queue behind each other via the deploy job's own group instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Secrets are scoped per step, never at workflow or job level: `bun install`
# and third-party actions run with no secrets in their environment, and the
# Cloudflare deploy token is only present on the two wrangler steps.

jobs:
  # Runs the same `bun preflight` as local pre-commit — one source of truth
  # for what "green" means (lint, format, typecheck, schema check, knip,
  # unit + integration tests). The integration runner uses an ephemeral
  # sqlite file; no external services needed.
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_IMAGES_EDITOR_API_TOKEN: ${{ secrets.CLOUDFLARE_IMAGES_EDITOR_API_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.MUX_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: bun run preflight

  # Build and ship the app to Cloudflare Workers. Runtime secrets live on
  # the worker (`wrangler secret put`), not here. The build step's env only
  # feeds env validation, Sentry source maps and VITE_ vars.
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: unehaus-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: build
        env:
          VITE_ENVIRONMENT: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_IMAGES_EDITOR_API_TOKEN: ${{ secrets.CLOUDFLARE_IMAGES_EDITOR_API_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.MUX_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: bun run build
      - name: apply D1 migrations
        # Same contract as the old bundled migrator: applies anything not yet
        # recorded, no-op once current. Roll-forward only.
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler d1 migrations apply unehaus --remote
      - name: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy
      - name: smoke check
        # Hits the workers.dev alias, not une.haus — the zone's bot
        # protection 403s plain curl from GH runner IPs; workers.dev serves
        # the same deployed worker without the zone WAF in front.
        run: |
          set -euo pipefail
          for url in https://unehaus.jrnxf.workers.dev; do
            ok=""
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null "$url"; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "$url not responding after deploy" >&2
              exit 1
            fi
          done
